version: '3.8'

services:

  # SWAGGER UI - Centralized API Documentation
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    ports:
      - "8089:8080"
    environment:
      - URLS=[{"url":"http://localhost:8080/api-docs","name":"Gateway API"},{"url":"http://localhost:8081/v3/api-docs","name":"Auth Service"},{"url":"http://localhost:8083/v3/api-docs","name":"Wallet Service"},{"url":"http://localhost:8084/v3/api-docs","name":"Order Service"}]
      - URLS_PRIMARY_NAME=Gateway API
    networks:
      - monitoring-network
      - brokerx-network
    restart: unless-stopped

  # PROMETHEUS - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-network
      - brokerx-network
    restart: unless-stopped

  # GRAFANA - Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - monitoring-network
    restart: unless-stopped



volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  brokerx-network:
    external: true
  monitoring-network:
    driver: bridge