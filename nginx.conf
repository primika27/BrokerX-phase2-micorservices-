events {
    worker_connections 1024;
}

http {
    # Configuration des serveurs upstream pour les gateways
    upstream gateway_backend {
        least_conn;  # Load balancing par connexions minimales
        server gateway-1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server gateway-2:8080 weight=1 max_fails=3 fail_timeout=30s;
        
        # Health checks
        keepalive 32;
    }

    # Configuration des serveurs upstream pour les OrderServices
    upstream order_service_backend {
        least_conn;
        server order-service-1:8084 weight=1 max_fails=3 fail_timeout=30s;
        server order-service-2:8084 weight=1 max_fails=3 fail_timeout=30s;
        
        keepalive 16;
    }

    # Configuration des serveurs upstream pour les MarketDataServices
    upstream market_data_backend {
        least_conn;
        server market-data-service-1:8086 weight=1 max_fails=3 fail_timeout=30s;
        server market-data-service-2:8086 weight=1 max_fails=3 fail_timeout=30s;
        
        keepalive 16;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Configuration générale
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Configuration du load balancer principal
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Load balancer status (Nginx Plus feature simulation)
        location /nginx-status {
            access_log off;
            return 200 "Active connections: $connections_active\nReading: $connections_reading\nWriting: $connections_writing\nWaiting: $connections_waiting\n";
            add_header Content-Type text/plain;
        }

        # Route principale vers les gateways
        location / {
            proxy_pass http://gateway_backend;
            
            # Headers pour maintenir les informations client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Health checks et failover
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # Route spécifique pour les API d'ordres (avec sticky session si nécessaire)
        location /api/orders/ {
            proxy_pass http://order_service_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Configuration pour WebSocket si nécessaire
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # Route spécifique pour les données de marché (cache-friendly)
        location /api/market-data/ {
            proxy_pass http://market_data_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache configuration pour les données de marché
            proxy_cache_valid 200 30s;  # Cache les réponses 200 pendant 30 secondes
            proxy_cache_valid 404 1m;   # Cache les 404 pendant 1 minute
            
            # Headers de cache
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # WebSocket support pour les notifications en temps réel
        location /ws/ {
            proxy_pass http://gateway_backend;
            
            # Configuration WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts plus longs pour WebSocket
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # 5 minutes pour les connexions WebSocket
            
            # Pas de buffering pour WebSocket
            proxy_buffering off;
            
            # Sticky session pour WebSocket (IP Hash)
            ip_hash;
        }
    }

    # Serveur de monitoring/status (optionnel)
    server {
        listen 8081;
        server_name localhost;

        location /status {
            access_log off;
            
            # Status simple en JSON
            return 200 '{
                "status": "healthy",
                "timestamp": "$time_iso8601",
                "upstreams": {
                    "gateway": "http://gateway_backend",
                    "order_service": "http://order_service_backend", 
                    "market_data": "http://market_data_backend"
                }
            }';
            add_header Content-Type application/json;
        }

        location /metrics {
            access_log off;
            
            # Métriques basiques
            return 200 '# HELP nginx_connections_active Active connections
# TYPE nginx_connections_active gauge
nginx_connections_active $connections_active
# HELP nginx_connections_reading Reading connections  
# TYPE nginx_connections_reading gauge
nginx_connections_reading $connections_reading
# HELP nginx_connections_writing Writing connections
# TYPE nginx_connections_writing gauge  
nginx_connections_writing $connections_writing
# HELP nginx_connections_waiting Waiting connections
# TYPE nginx_connections_waiting gauge
nginx_connections_waiting $connections_waiting
';
            add_header Content-Type text/plain;
        }
    }
}