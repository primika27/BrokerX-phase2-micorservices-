            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache configuration pour les données de marché
            proxy_cache_valid 200 30s;  # Cache les réponses 200 pendant 30 secondes
            proxy_cache_valid 404 1m;   # Cache les 404 pendant 1 minute
            
            # Headers de cache
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # WebSocket support pour les notifications en temps réel
        location /ws/ {
            proxy_pass http://gateway_backend;
            
            # Configuration WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts plus longs pour WebSocket
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # 5 minutes pour les connexions WebSocket
            
            # Pas de buffering pour WebSocket
            proxy_buffering off;
        }

        # API Documentation - Swagger UI centralisé
        location /docs {
            proxy_pass http://swagger-ui:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers pour éviter les problèmes CORS
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        }

        # API Documentation directe pour chaque service
        location /docs/gateway {
            proxy_pass http://gateway_backend/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type application/json;
        }

        location /docs/auth {
            proxy_pass http://auth_service_backend/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type application/json;
        }

        location /docs/wallet {
            proxy_pass http://wallet_service_backend/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type application/json;
        }

        location /docs/order {
            proxy_pass http://order_service_backend/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type application/json;
        }

        location /docs/matching {
            proxy_pass http://matching_service_backend/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type application/json;
        }

        location /docs/market-data {
            proxy_pass http://market_data_backend/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type application/json;
        }
    }

    # Serveur de monitoring/status
    server {
        listen 8090;
        server_name localhost;

        location /status {
            access_log off;
            
            # Status simple en JSON
            return 200 '{
                "status": "healthy",
                "timestamp": "$time_iso8601",
                "upstreams": {
                    "gateway": "http://gateway_backend",
                    "order_service": "http://order_service_backend", 
                    "market_data": "http://market_data_backend"
                }
            }';
            add_header Content-Type application/json;
        }

        # Nginx status pour prometheus exporter
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location /metrics {
            access_log off;
            
            # Métriques basiques
            return 200 '# HELP nginx_connections_active Active connections
# TYPE nginx_connections_active gauge
nginx_connections_active $connections_active
# HELP nginx_connections_reading Reading connections  
# TYPE nginx_connections_reading gauge
nginx_connections_reading $connections_reading
# HELP nginx_connections_writing Writing connections
# TYPE nginx_connections_writing gauge  
nginx_connections_writing $connections_writing
# HELP nginx_connections_waiting Waiting connections
# TYPE nginx_connections_waiting gauge
nginx_connections_waiting $connections_waiting
';
            add_header Content-Type text/plain;
        }
    }
}