# Configuration du MarketDataService
server.port=8086

# Application
spring.application.name=market-data-service
spring.profiles.active=dev

# Database H2 (pour les métadonnées éventuelles)
spring.datasource.url=jdbc:h2:mem:marketdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis (pour la mise en cache des données de marché) - DÉSACTIVÉ pour tests
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.database=3

# RabbitMQ (pour recevoir les événements de trading)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# WebSocket Configuration
spring.websocket.allowed-origins=*

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.broker.marketDataService=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuration Redis pour MarketDataService
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:brokerx123}
spring.redis.timeout=2000
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.min-idle=0

# Cache configuration
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.time-to-live=300000
spring.cache.redis.key-prefix=brokerx: