version: '3.8'

services:

#Frontend service
  frontend:
    build: ./frontend
    image: brokerx-frontend:dev
    ports:
      - "5173:80"            # visit http://localhost:5173
    depends_on:
      - nginx-lb
    networks:
      - brokerx-network
    environment:
      - NODE_ENV=production

  # NGINX LOAD BALANCER
  nginx-lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
    networks:
      - brokerx-network

  # GATEWAY SERVICE - Instance 1
  gateway-1:
    build:
      context: ./gatewayService
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - INSTANCE_ID=gateway-1
    depends_on:
      - auth-service
      - client-service
      - wallet-service
      - order-service-1
      - order-service-2
      - matching-service
      - market-data-service-1
      - market-data-service-2
    networks:
      - brokerx-network

  # GATEWAY SERVICE - Instance 2
  gateway-2:
    build:
      context: ./gatewayService
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - INSTANCE_ID=gateway-2
    depends_on:
      - auth-service
      - client-service
      - wallet-service
      - order-service-1
      - order-service-2
      - matching-service
      - market-data-service-1
      - market-data-service-2
    networks:
      - brokerx-network

  # AUTH SERVICE (Single instance - pas de load balancing nécessaire)
  auth-service:
    container_name: auth-service
    build:
      context: ./authService/authService
      dockerfile: Dockerfile
    ports:
      - "8083:8081"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/authdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
    volumes:
      - auth-data:/data
    networks:
      - brokerx-network

  # CLIENT SERVICE (Single instance)
  client-service:
    container_name: client-service
    build:
      context: ./clientService/clientService
      dockerfile: Dockerfile
    ports:
      - "8084:8082"
    environment:
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/clientdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
    volumes:
      - client-data:/data
    networks:
      - brokerx-network

  # WALLET SERVICE (Single instance)
  wallet-service:
    container_name: wallet-service
    build:
      context: ./walletService/walletService
      dockerfile: Dockerfile
    ports:
      - "8085:8083"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/walletdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
    volumes:
      - wallet-data:/data
    networks:
      - brokerx-network

  # ORDER SERVICE - Instance 1 (Load Balanced)
  order-service-1:
    build:
      context: ./orderService/orderService
      dockerfile: Dockerfile
    ports:
      - "8086:8084"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/orderdb1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=brokerx123
      - INSTANCE_ID=order-service-1
    volumes:
      - order-data-1:/data
    depends_on:
      - wallet-service
      - rabbitmq
      - redis
    networks:
      - brokerx-network

  # ORDER SERVICE - Instance 2 (Load Balanced)
  order-service-2:
    build:
      context: ./orderService/orderService
      dockerfile: Dockerfile
    ports:
      - "8087:8084"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/orderdb2;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=brokerx123
      - INSTANCE_ID=order-service-2
    volumes:
      - order-data-2:/data
    depends_on:
      - wallet-service
      - rabbitmq
      - redis
    networks:
      - brokerx-network

  # MATCHING SERVICE (Single instance - stateful)
  matching-service:
    container_name: matching-service        
    build:
      context: ./matchingService/matchingService
      dockerfile: Dockerfile
    ports:
      - "8088:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/matchingdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
      - SPRING_RABBITMQ_HOST=rabbitmq
    volumes:
      - matching-data:/data
    depends_on:
      - rabbitmq
    networks:
      - brokerx-network

  # MARKET DATA SERVICE - Instance 1 (Load Balanced)
  market-data-service-1:
    build:
      context: ./marketDataServices
      dockerfile: Dockerfile
    ports:
      - "8089:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:marketdb1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=brokerx123
      - INSTANCE_ID=market-data-service-1
    depends_on:
      - rabbitmq
      - redis
    networks:
      - brokerx-network

  # MARKET DATA SERVICE - Instance 2 (Load Balanced)
  market-data-service-2:
    build:
      context: ./marketDataServices
      dockerfile: Dockerfile
    ports:
      - "8090:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:marketdb2
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=brokerx123
      - INSTANCE_ID=market-data-service-2
    depends_on:
      - rabbitmq
      - redis
    networks:
      - brokerx-network
  
  # RABBITMQ
  rabbitmq:          
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - brokerx-network

  # REDIS CACHE
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "brokerx123"
    volumes:
      - redis-data:/data
    networks:
      - brokerx-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  
volumes:
  auth-data:
    driver: local
  client-data:
    driver: local
  wallet-data:
    driver: local
  order-data-1:
    driver: local
  order-data-2:
    driver: local
  matching-data:
    driver: local
  redis-data:
    driver: local

networks:
  brokerx-network:
    driver: bridge