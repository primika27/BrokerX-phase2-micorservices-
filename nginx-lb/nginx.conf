events {
    worker_connections 1024;
}

http {
    # Configuration du load balancing
    upstream gateway_backend {
        # Round-robin par défaut (distribution équitable)
        # Autres algorithmes disponibles: least_conn, ip_hash
        
        server gateway:8080 max_fails=3 fail_timeout=30s;
        
        # Les instances supplémentaires seront ajoutées automatiquement
        # quand vous faites --scale gateway=N
        # Docker DNS résout "gateway" vers toutes les instances
    }

    # Configuration des logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Serveur principal
    server {
        listen 8080;
        server_name localhost;

        # Configuration des timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Headers pour le proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy vers le backend
        location / {
            # Gestion CORS permissive pour toutes les requêtes
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin';
                add_header 'Access-Control-Allow-Methods' '*';
                add_header 'Access-Control-Allow-Headers' '*';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Max-Age' 3600;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }
            
            proxy_pass http://gateway_backend;
            
            # Headers CORS permissifs pour toutes les réponses
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' '*' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Support pour WebSocket si nécessaire
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
